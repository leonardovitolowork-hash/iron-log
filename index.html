<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron Log</title>
<meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>Iron Log</h1><p id="quote"></p></div>
  <p id="storageWarning" class="storageWarning" role="alert" hidden></p>
  <div class="seg" aria-label="Workout selector">
    <button id="dayABtn" class="active">Upper A</button><button id="dayBBtn">Lower A</button>
    <button id="dayCBtn">Upper B</button><button id="dayDBtn">Lower B</button><button id="dayEBtn">AMRAP</button>
  </div>
  <div id="workout"></div>
  <div class="card"><div class="head"><h2>Body weight</h2></div><div class="bwRow"><input id="bwInput" type="number" min="0" step="any" placeholder="Today's weight (kg)" inputmode="decimal" style="margin-top:0"><span class="bwHint">Saved when you log your session</span></div><canvas id="bwChart" style="margin-top:14px"></canvas></div>
  <div class="card"><div class="head"><h2>Rest timer</h2></div><div class="timerWrap" id="timerWrap"><div id="timerDisplay">01:30</div><div class="timerBtns"><button onclick="startTimer(60)">60s</button><button onclick="startTimer(90)">90s</button><button onclick="startTimer(120)">120s</button><button onclick="startTimer(180)">3min</button></div></div></div>
  <div class="card"><div class="head"><h2>Progress</h2><select id="exerciseSelect"></select></div><canvas id="progressChart"></canvas></div>
  <div class="card"><div class="head"><h2>Session history</h2></div><div id="history"></div><div class="backupRow"><button class="backupBtn exportBtn" onclick="exportBackup()">Export backup</button><button class="backupBtn importBtn" onclick="importBackup()">Import backup</button></div></div>
</div>
<div class="sheetOverlay" id="sheetOverlay" onclick="closeSwap()"></div>
<div class="sheet" id="swapSheet"><div class="sheetHandle"></div><h3 id="sheetTitle">Alternatives</h3><div id="sheetOptions"></div><button class="sheetClose" onclick="closeSwap()">Close</button></div>
</body>
</html>
