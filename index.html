<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Iron Log</title>
<meta name="theme-color" content="#171512">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="wrap"><header class="hero"><div class="eyebrow">IRON LOG <span>TRAINING OS</span></div><h1>Train with intent.</h1><p id="quote"></p></header><div class="seg" aria-label="Workout selector"><button id="dayABtn" class="active">Upper A</button><button id="dayBBtn">Lower A</button><button id="dayCBtn">Upper B</button><button id="dayDBtn">Lower B</button><button id="dayEBtn">AMRAP</button></div><main id="workout"></main><div class="card"><div class="head"><h2>Body Weight</h2><span class="sectionTag">TRACK</span></div><div class="bwRow"><input id="bwInput" placeholder="Today's weight · kg" inputmode="decimal" style="margin-top:0"><span class="bwHint">Saved when you log your session</span></div><canvas id="bwChart" style="margin-top:14px"></canvas></div><div class="card"><div class="head"><h2>Rest Timer</h2><span class="sectionTag">RECOVERY</span></div><div class="timerWrap" id="timerWrap"><div id="timerDisplay">01:30</div><div class="timerBtns"><button onclick="startTimer(60)">60s</button><button onclick="startTimer(90)">90s</button><button onclick="startTimer(120)">120s</button><button onclick="startTimer(180)">3min</button></div></div></div><div class="card"><div class="head"><h2>Progress</h2><span class="sectionTag">INSIGHTS</span></div><select id="exerciseSelect"></select><canvas id="progressChart"></canvas></div><div class="card"><div class="head"><h2>Session History</h2><span class="sectionTag">ARCHIVE</span></div><div id="history"></div><div class="backupRow"><button class="backupBtn exportBtn" onclick="exportBackup()">Export backup</button><button class="backupBtn importBtn" onclick="importBackup()">Import backup</button></div></div></div><div class="sheetOverlay" id="sheetOverlay" onclick="closeSwap()"></div><div class="sheet" id="swapSheet"><div class="sheetHandle"></div><h3 id="sheetTitle">Exercise alternatives</h3><div id="sheetOptions"></div><button class="sheetClose" onclick="closeSwap()">Close</button></div><script src="app.js"></script></body></html>
